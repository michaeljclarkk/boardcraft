[package]
name = "boardcraft-tools"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
postgres-smoke = []
platform-smoke = []

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
wait-timeout = "0.2"

[target.'cfg(windows)'.dependencies]
getrandom = "0.4"
hex = "0.4"
windows-dpapi = "0.2"
zeroize = "1"
winsafe = { version = "=0.0.27", features = ["kernel"] }

[lints.rust]
unsafe_code = "forbid"
