[workspace]
resolver = "3"

[package]
name = "boardcraft-android-tools"
version = "0.1.0"
edition = "2024"
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dunce = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[[bin]]
name = "boardcraft-android-tools"
path = "src/main.rs"
