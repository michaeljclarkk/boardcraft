name: Port status

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate table and chart
        run: node tools/port-status.mjs
      - name: Commit if stale
        run: |
          if ! git diff --quiet; then
            git config user.name "boardcraft status"
            git config user.email "status@users.noreply.github.com"
            git add README.md docs/port-status.svg
            git commit -m "chore: refresh port status [skip ci]"
            git push
          fi
      - name: Job summary
        run: node tools/port-status.mjs --summary >> "$GITHUB_STEP_SUMMARY"
