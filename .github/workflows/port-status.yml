name: Port status

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate table and chart
        run: cargo run --quiet --locked --manifest-path tools/Cargo.toml -- port-status
      - name: Commit if stale
        run: |
          if ! git diff --quiet; then
            git config user.name "boardcraft status"
            git config user.email "status@users.noreply.github.com"
            git add README.md docs/port-status.svg
            git commit -m "chore: refresh port status [skip ci]"
            git push origin HEAD:main
          fi
      - name: Job summary
        run: cargo run --quiet --locked --manifest-path tools/Cargo.toml -- port-status --summary >> "$GITHUB_STEP_SUMMARY"
