[workspace]
members = ["crates/account", "crates/board", "crates/boardcraft-ui", "crates/desktop", "crates/mobile-edit-client", "crates/mobile-edit-host", "crates/web"]
resolver = "3"

[workspace.dependencies]
gpui-kit = "=0.11.0"
futures = "0.3"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = "0.3.107"
rpassword = "7.5.5"

[patch.crates-io]
gpui-pre-web = { path = "crates/web/.deps/gpui-pre-web" }

[profile.dev]
# Keep cold GPUI builds manageable on a developer workstation.
debug = "line-tables-only"

# Unoptimized GPUI builder chains retain large temporaries on the wasm stack
# while laying out a grouped board. Keep the viewer debuggable, but eliminate
# those temporaries without rebuilding the toolkit at a higher optimization.
[profile.dev.package.boardcraft-web]
opt-level = 1
