[package]
name = "boardcraft-web"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_family = "wasm")'.dependencies]
gpui-kit.workspace = true
boardcraft-ui = { path = "../boardcraft-ui" }
boardcraft-mobile-edit-client = { path = "../mobile-edit-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4", "js"] }
futures.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "AbortController", "AbortSignal", "BroadcastChannel", "DomException", "Event", "EventTarget",
    "IdbDatabase", "IdbFactory", "IdbObjectStore", "IdbOpenDbRequest", "IdbRequest",
    "IdbTransaction", "IdbTransactionMode", "Request", "RequestCredentials",
    "RequestInit", "RequestMode", "RequestRedirect", "Response", "Window", "History", "Location",
] }
