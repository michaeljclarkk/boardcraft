[package]
name = "boardcraft-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[features]
native-smoke = ["gpui-kit/test-support"]

[[test]]
name = "windows_smoke"
required-features = ["native-smoke"]

[dependencies]
gpui-kit = "=0.11.0"
postgres = "0.19"
boardcraft-board = { path = "../board" }
uuid = { version = "1", features = ["serde", "v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
