[package]
name = "boardcraft-mobile-edit-host"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
log = "0.4"
percent-encoding = "2"
postgres = "0.19"
boardcraft-account = { path = "../account" }
boardcraft-board = { path = "../board" }
boardcraft-mobile-edit-client = { path = "../mobile-edit-client" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
ring = "0.17"
tempfile = "3"
wait-timeout = "0.2"
rpassword.workspace = true

[features]
android-smoke = []

[[test]]
name = "android_emulator_edit"
required-features = ["android-smoke"]
