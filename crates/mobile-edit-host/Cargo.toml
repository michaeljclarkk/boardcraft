[package]
name = "boardcraft-mobile-edit-host"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
log = "0.4"
postgres = "0.19"
boardcraft-board = { path = "../board" }
boardcraft-mobile-edit-client = { path = "../mobile-edit-client" }
serde_json = "1"
tiny_http = "0.12"
uuid = "1"

[dev-dependencies]
tempfile = "3"
wait-timeout = "0.2"
uuid = { version = "1", features = ["v4"] }

[features]
android-smoke = []

[[test]]
name = "android_emulator_edit"
required-features = ["android-smoke"]
